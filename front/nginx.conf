server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        # resolver + proxy_pass em variável: nginx cacheia o IP resolvido de
        # "api" pra sempre se usar string fixa — quando o container da API é
        # recriado no deploy (IP novo), o nginx fica preso no IP antigo
        # ("Host is unreachable") até alguém reiniciar o frontend na mão.
        # Com resolver, ele re-resolve a cada 10s e acompanha o IP atual.
        # Sem URI depois da variável — nginx encaminha o path original
        # (/api/v1/...) sem reescrever. Com URI fixo aqui (ex: "$var/api/"),
        # a reescrita de prefixo do proxy_pass é desativada e o path vira
        # sempre literal "/api/", quebrando toda rota.
        resolver 127.0.0.11 valid=10s;
        set $api_upstream api:3000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
